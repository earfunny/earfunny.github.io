# Site configuration
title: earfunny
email: vanjuki81@gmail.com
description: >
  Portfolio and blog of earfunny — software developer, web enthusiast, and AI explorer.
baseurl: ""
url: "https://earfunny.github.io"

# Location
timezone: Asia/Jakarta

# Markdown and syntax highlighting
markdown: kramdown
highlighter: rouge

# Jekyll plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: earfunny
      excerpt_separator: "---"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .git
  - .github
  - README.md
